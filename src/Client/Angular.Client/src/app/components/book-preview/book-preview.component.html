<div class="card m-3" style="width: 15rem;">
  <a href="#">
    <img class="card-img-top" src="{{ book.imageUrl }}" alt="Card image cap">
    <div class="card-body">
      <h5 class="card-title text-container">{{ book.title }}</h5>
    </div>
    <div>
      <span>Rating: </span>
      <button class="rating_circle">{{ book.averageRating > 0 ? book.averageRating : "N/A" }}</button>
    </div>
  </a>
</div>
