<section class="h-100 p-0 m-0">
  <div class="container-fluid h-100">
    <div class="row h-100">
      <div class="col-lg-5 h-100 bg-main p-0">
        <div class="logo-container">
          <img src="./assets/img/logo.png" class="logo-img" alt="logo">
          <h1 class="strong-title">
            Every burnt book enlightens the world.
          </h1>
        </div>
      </div>

      <div class="col-lg-7 d-flex flex-column justify-content-center align-items-center" style="height: 100%">
        <div class="container row">
          <div class="col-md-4 offset-md-4 col-sm-6 offset-sm-3">
            <div class="error-message">
              <span *ngIf="!loginValid"> {{ this.message }}</span>
            </div>
            <div class="card auth">
              <div class="card-body auth-card">
                <form [formGroup]="form" (submit)="login()">
                  <div class="mb-2">
                    <label for="username">Username : </label>
                    <input type="text" id="username" class="form-control" placeholder="Username" formControlName="userName"/>
                  </div>
                  <div class="mb-2">
                    <label for="password">Password : </label>
                    <input type="password" id="password" class="form-control" placeholder="********" formControlName="password">
                  </div>
                  <div class="text-center">
                    <input type="submit" class="btn signup-btn bg-red" value="Sign In">
                  </div>
                  <div class="text-center login cl-white">
                    Don't have an account? <a [routerLink]="['/register']" class="cl-red">Sign Up</a> here.
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
