<div class="card mb-3">
  <div class="row">

    <div class="col-md-2">
      <img src="{{book.imageUrl}}" class="img-fluid rounded-start" alt="book cover">
    </div>

    <a [routerLink]="['/book', book.id]" class="col-md-8 p-0">
      <div class="card-body">
        <h5 class="card-title">{{ book.title }}</h5>
        <p class="card-text">
          Edition count: {{ book.editionCount }}
        </p>
        <p class="card-text">
          Publication year: {{ book.publicationYear }}
        </p>
        <p class="card-text">
          Authors: {{ getAuthorsNames() }}
        </p>
        <p class="card-text">
          Languages: {{ getLanguagesNames() }}
        </p>
        <p class="card-text">
          Subjects: {{ getSubjectsNames() }}
        </p>
      </div>
    </a>


    <div class="d-flex flex-column col-md-2 p-3">
      <div class="px-2 pt-3 d-flex justify-content-between align-items-center">
        <span>User Rating: </span>
        <button class="rating_circle" [ngClass]="{
      'bg-success': book.averageRating >= 4,
      'bg-warning': book.averageRating < 4 && book.averageRating > 2,
      'bg-danger' : book.averageRating < 2 }">
          {{ book.averageRating > 0 ? book.averageRating.toFixed(2) : "N/A" }}
        </button>
      </div>
      <div class="px-2 d-flex justify-content-between align-items-center">
        <span>Critic Rating: </span>
        <button class="rating_circle" [ngClass]="{
      'bg-success': book.averageCriticRating >= 4,
      'bg-warning': book.averageCriticRating < 4 && book.averageCriticRating > 2,
      'bg-danger' : book.averageCriticRating < 2 }">
          {{ book.averageCriticRating > 0 ? book.averageCriticRating.toFixed(2) : "N/A" }}
        </button>
      </div>
    </div>
  </div>
</div>
