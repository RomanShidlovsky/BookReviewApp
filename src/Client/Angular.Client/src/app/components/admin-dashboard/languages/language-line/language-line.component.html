<div class="card mb-3 pl-1">
  <div class="row">
    <a [routerLink]="['language-update', language.id]" class="col-md-11 p-0">
      <div class="card-body">
        <h5 class="card-title">{{ language.name }}</h5>
        <p class="card-text">
          Id: {{ language.id }}
        </p>
      </div>
    </a>

    <div class="d-flex justify-content-center align-items-center col-md-1 dlt-btn p-0">
      <svg (click)="confirmDeletion()" xmlns="http://www.w3.org/2000/svg" width="30" height="30"
           fill="red" class="bi bi-trash"
           viewBox="0 0 20 20">
        <path
          d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
        <path fill-rule="evenodd"
              d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
      </svg>
    </div>
  </div>
</div>
